name: Auto-Update Agenda API

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Récupération du code avec git plutôt qu'avec actions/checkout : le runner
      # self-hosted retéléchargeait le tarball de l'action à chaque run et
      # codeload.github.com finissait par répondre 429 (Too Many Requests),
      # ce qui faisait échouer le déploiement avant même la compilation.
      - name: Checkout du code
        run: |
          set -e
          # Garde-fou : ne jamais opérer à la racine si la variable était vide
          test -n "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # Repart d'un espace de travail vide (aucun résidu du run précédent)
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Récupère exactement le commit poussé, pas la tête de branche
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          # Retire le jeton du .git/config maintenant que le code est là
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Publish
        run: dotnet publish ./seragenda.csproj -c Release -o ./publish

      - name: Update Service
        run: |
          # Sauvegarde le fichier de configuration de production
          sudo cp /var/www/serapi/appsettings.Production.json /tmp/appsettings.Production.json.backup 2>/dev/null || true

          # Copie les fichiers vers le dossier final
          sudo cp -r ./publish/* /var/www/serapi/

          # Restaure le fichier de configuration de production
          sudo cp /tmp/appsettings.Production.json.backup /var/www/serapi/appsettings.Production.json 2>/dev/null || true

          # Redémarre l'API pour appliquer les changements
          sudo systemctl restart serapi.service
